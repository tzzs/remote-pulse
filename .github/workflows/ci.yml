name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Integration tests (real VS Code extension host)
        run: xvfb-run -a npm run test:integration

      - name: Package .vsix (sanity check)
        run: npx @vscode/vsce package --no-yarn

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: remote-pulse-vsix
          path: '*.vsix'
          retention-days: 14

      - name: Comment PR with the artifact download link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- remote-pulse-vsix-artifact -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `📦 A test build of this PR is ready — [open this workflow run](${runUrl}) and download \`remote-pulse-vsix\` under **Artifacts** at the bottom of the summary page (kept for 14 days).`,
              '',
              'Install it locally with `code --install-extension remote-pulse-*.vsix`, or via the Extensions view → **Install from VSIX...**.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
